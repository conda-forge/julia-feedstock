{% set name = "julia" %}
{% set version = "1.13.4" %}
{% set sha256 = "55bb4442c887a3e99f287b53c467fdd5e78e376344ea2a84865742d13a27d71c" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: julia-{{ version }}-full.tar.gz

  url: https://github.com/JuliaLang/julia/releases/download/v{{ version }}/julia-{{ version }}-full.tar.gz
  sha256: {{ sha256 }}
  patches:
    ## from https://github.com/archlinux/svntogit-community/tree/packages/julia/trunk
    - patches/julia-hardcoded-libs.patch
    ## issues with this precompile test, see https://github.com/JuliaLang/julia/issues/43535
    # - patches/disable-testing-Baz.baz.patch  # [linux]
    - patches/julia-libunwind-1.6.patch  # [linux]
    # 1.10.3 links suitesparse cuda libs, patch should not be needed for 1.10.4
    # - patches/suitesparse-no-cuda.patch
    # suitesparse soname version is hardcoded
    # - patches/suitesparse-soname.patch
    ## these gmp tests return DivideError rather than OutOfMemoryError on cf ci
    - patches/disable-some-gmp-tests.patch
    ## for some reason, this new change results in weird printouts in cf ci
    - patches/disable-some-cmdlineargs-test.patch
    # missing https://github.com/JuliaLang/julia/issues/52067
    - patches/bf16_darwin.patch
    # slow build machine stuttery output fix, superseded upstream in 1.13.0 by a rewrite
    # of stdlib/REPL/src/precompile.jl using the same prompt_ready/activate_done event
    # synchronization approach, so this no longer applies (and is no longer needed)
    # - patches/repl-precompile.patch
    # backport of https://github.com/JuliaLang/julia/pull/60778 (`xcrun --sdk macosx
    # --show-sdk-version`) is already included upstream as of 1.13.4, so the patch no longer applies
    # - patches/xcrun-sdk-version.patch  # [osx]
    # v1.12.7 regression from JuliaLang/julia@fde4693fc51 (backport of #61652 + #62152): the
    # Darwin whole_archive macro now unconditionally passes -force_load, which breaks when
    # LIBUTF8PROC is a -lutf8proc flag (USE_SYSTEM_UTF8PROC=1) rather than a static archive path,
    # causing "ld: file not found: -lutf8proc" when linking libjulia-internal
    - patches/darwin-force-load-system-libs.patch  # [osx]

build:
  skip: true  # [win]
  number: 0
  binary_relocation: false
  features:

requirements:
  build:
    - make
    - perl
    - python
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - openblas-ilp64
    - patchelf  # [linux]
    - openlibm
    - gmp
    - curl
    - libgit2   # [not osx]
    - libssh2
    # TEMPORARY: libcxx 23.1.5 rebuilds (build number >= 1, uploaded 2026-11-13) no longer
    # export std::__1::__vector_base_common<true>::__throw_length_error() and
    # __basic_string_common<true>::__throw_length_error(), which the prebuilt static libLLVM*.a
    # need, so libjulia-internal fails to link on osx-64. Build 0 works (see #318).
    - libcxx 23.1.5 *_0  # [osx]
    - libosxunwind  # [osx]
    - libunwind  # [linux]
    - mpfr
    - arpack
    - suitesparse
    - pcre2
    - git
    - libutf8proc
    - libnghttp2
    - zlib
    - p7zip

  run:
    - openblas-ilp64
    # TEMPORARY: libjulia-internal imports the legacy libc++ symbols that libcxx 23.1.5
    # builds >= 1 no longer export (dlopen fails with "Symbol not found:
    # __ZNKSt3__120__vector_base_commonILb1EE20__throw_length_errorEv"), so keep the same
    # pin as in host. See https://github.com/JuliaLang/julia/issues/64968
    - libcxx 23.1.5 *_0  # [osx]
    - libosxunwind  # [osx]
    - libunwind  # [linux]
    - gmp
    - openlibm
    - arpack
    - suitesparse
    - pcre2
    - curl
    - libgit2  # [not osx]
    - libssh2
    - mpfr
    - git
    - libutf8proc
    - libnghttp2
    - zlib
    - p7zip

test:
  commands:
    # check out versioninfo
    - julia -e 'using InteractiveUtils; InteractiveUtils.versioninfo()'
    # see if env vars are defined correctly
    - echo $CONDA_JL_HOME
    - echo $CONDA_JL_CONDA_EXE
    - echo $CI
    # run julia tests
    # 2024/02/04: remove bitarray and threads due to flakiness on cf ci 
    - CI=false julia -e 'Base.runtests(["subarray", "core", "compiler", "worlds", "keywordargs", "numbers", "subtype", "char", "strings", "triplequote", "unicode", "intrinsics", "dict", "hashing", "iobuffer", "staged", "offsetarray", "arrayops", "tuple", "reduce", "reducedim", "abstractarray", "intfuncs", "simdloop", 
      "vecelement", "rational", "copy", "math", "fastmath", "functional", "iterators", "operators", "ordering", "path", "ccall", "parse", "gmp", "sorting", "spawn", "backtrace", "exceptions", "file", "read", "version", "namedtuple", "mpfr", "broadcast", "complex", "floatapprox", "reflection", "regex", "float16", 
      "combinatorics", "sysinfo", "env", "rounding", "ranges", "mod2pi", "euler", "show", "client", "errorshow", "sets", "goto", "llvmcall", "llvmcall2", "ryu", "some", "meta", "stacktraces", "docs", "misc", "stress", "binaryplatforms", "atexit", "enums", "int", "interpreter", "checked", "bitset", "floatfuncs", 
      "precompile", "boundscheck", "error", "ambiguous", "cartesian", "osutils", "channels", "iostream", "secretbuffer", "specificity", "reinterpretarray", "syntax", "corelogging", "missing", "asyncmap", "smallarrayshrink", "download", "opaque_closure", "filesystem"]; ncores=ceil(Int, Sys.CPU_THREADS))'  # all except stdlib?
    - CI=false julia --project -e 'delete!(ENV, "JULIA_PROJECT"); delete!(ENV, "JULIA_LOAD_PATH"); Base.runtests(["loading", "cmdlineargs"])' # Julia 1.7.1 tests error here when a project is defined
    - CI=false julia -e 'import Pkg;Pkg.add("LibSSH2_jll")'
    - CI=false julia -e 'import Pkg;Pkg.add("Sundials")'
    - echo $JULIA_CONDAPKG_BACKEND
    - CI=false julia -e 'import Pkg; Pkg.add("CondaPkg"); using CondaPkg; CondaPkg.add_channel("conda-forge"); CondaPkg.status(); CondaPkg.current_packages()'
    - CI=false julia -e 'import Pkg; Pkg.add("CondaPkg"); using CondaPkg; CondaPkg.add_channel("conda-forge"); print(CondaPkg.conda_cmd())'
  requires:
    - perl

about:
  home: http://julialang.org/
  license: MIT
  license_file: LICENSE.md
  summary: A high-performance dynamic programming language for data science
  description: |
    Julia is a high-level, high-performance dynamic language for technical computing.
    The main homepage for Julia can be found at julialang.org.
  dev_url: https://github.com/JuliaLang/julia
  doc_url: https://docs.julialang.org

extra:
  recipe-maintainers:
    - SylvainCorlay
    - bgruening
    - dfornika
    - acaprez
    - mariusvniekerk
    - abhi18av
    - mkitti
    - ngam
